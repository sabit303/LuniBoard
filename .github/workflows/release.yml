name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Test
        run: make vet test e2e
      - name: Linux tarballs (consumed by the AUR package luniboard-bin)
        run: make release VERSION=${GITHUB_REF_NAME#v}
      - name: Other platforms (raw binaries)
        run: |
          make cross VERSION=${GITHUB_REF_NAME#v}
          rm -f dist/luniboard-linux-*
      - name: Installer script
        run: cp scripts/install.sh dist/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --prerelease
