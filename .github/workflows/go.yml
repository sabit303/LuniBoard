name: Go daemon

on:
  push:
    branches: [main]
    paths: ["daemon/**", "protocol/**", "Makefile", ".github/workflows/go.yml"]
  pull_request:
    paths: ["daemon/**", "protocol/**", "Makefile", ".github/workflows/go.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Vet and format check
        run: make vet
      - name: Unit and integration tests (race detector)
        run: make test
      - name: End-to-end CLI test
        run: make e2e
      - name: Validate systemd unit
        run: systemd-analyze --user verify packaging/linux/systemd/luniboard.service || true

  real-clipboard:
    # Exercises the X11 adapter against a virtual X server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - run: sudo apt-get update && sudo apt-get install -y xvfb xclip xsel
      - name: X11 adapter against Xvfb
        working-directory: daemon
        run: |
          Xvfb :99 &
          sleep 1
          DISPLAY=:99 LUNIBOARD_TEST_REAL_CLIPBOARD=1 go test -count=1 -run Real ./adapters/clipboard/x11/

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, windows/amd64, darwin/amd64, darwin/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Build ${{ matrix.target }}
        working-directory: daemon
        run: |
          export GOOS=${TARGET%/*} GOARCH=${TARGET#*/} CGO_ENABLED=0
          go build -o /dev/null ./cmd/luniboard
        env:
          TARGET: ${{ matrix.target }}
